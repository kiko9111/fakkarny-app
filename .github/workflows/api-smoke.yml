# Live API smoke test: runs the phone's own API client (apps/mobile/src/e2e) against the
# production test server as two fresh install users, and times the screens' GET requests.
# Runs when a pushed commit message contains "[api-smoke]", or by hand from the Actions tab.
# The cloud session can't reach the Railway URL, so this is how it checks the live server.
# Test users are throwaway install ids; they leave rows named "Mona"/"Omar" behind.
name: Live API smoke test

on:
  push:
  workflow_dispatch:
    inputs:
      quiet:
        description: "Seconds the server is left quiet before the timed chat turn (35 is one person between two messages; up to 280 checks that the server's kept database connections last)"
        default: "35"

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[api-smoke]')
    runs-on: ubuntu-latest
    env:
      API: https://fakkarniapi-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Time the screens' requests
        run: |
          U=$(cat /proc/sys/kernel/random/uuid)
          # /health says the server's process id: "pid":1 means it is the container's first
          # process, the one a deploy's stop signal goes to (Dockerfile).
          curl -s -m 30 -w "  /health %{http_code} %{time_total}s\n" "$API/health"
          for p in /me /circles /tasks /trackers /daftar /money /splits "/items?status=open" /me/referral; do
            curl -s -m 30 -o /tmp/body -w "$p %{http_code} %{time_total}s " -H "x-install-id: $U" -H "x-message-kinds: 2" "$API$p"; head -c 300 /tmp/body; echo
          done
          echo "--- every tab in one answer (404 until the server has the route), plain and gzipped, then asked again with its ETag"
          curl -s -m 30 -o /dev/null -D /tmp/head -w "/bootstrap %{http_code} %{time_total}s %{size_download} bytes\n" -H "x-install-id: $U" -H "x-message-kinds: 2" "$API/bootstrap"
          curl -s -m 30 -o /dev/null -w "/bootstrap gzip %{http_code} %{time_total}s %{size_download} bytes\n" -H "accept-encoding: gzip" -H "x-install-id: $U" -H "x-message-kinds: 2" "$API/bootstrap"
          TAG=$(grep -i '^etag:' /tmp/head | cut -d' ' -f2- | tr -d '\r' || true)
          if [ -n "$TAG" ]; then curl -s -m 30 -o /dev/null -w "/bootstrap unchanged %{http_code} %{time_total}s\n" -H "if-none-match: $TAG" -H "x-install-id: $U" -H "x-message-kinds: 2" "$API/bootstrap"; fi
          echo "--- 20 quick /circles calls (rate limit check)"
          for i in $(seq 1 20); do curl -s -m 30 -o /dev/null -w "%{http_code} " -H "x-install-id: $U" "$API/circles"; done; echo
      - name: Time a chat turn and one database round trip
        env:
          QUIET: ${{ inputs.quiet || '35' }}
        run: |
          U=$(cat /proc/sys/kernel/random/uuid)
          H=(-H "x-install-id: $U" -H "x-message-kinds: 2" -H "content-type: application/json")
          curl -s -o /dev/null "${H[@]}" "$API/me"
          # x-railway-edge is the edge nearest this runner, not where the server runs. Sending
          # x-railway-debug asks Railway to add x-railway-upstream-zone: the zone that served it.
          echo "--- the edge nearest this runner (x-railway-edge), the zone the server runs in (x-railway-upstream-zone), and whether it tells phones to ask for replies as they are written (x-reply-stream)"
          curl -s -o /dev/null -D - -H "x-railway-debug: 1" "$API/health" | grep -i -E "^(x-railway|server|via|x-reply-stream)" || true
          echo "--- 5x /health (network only, no database)"
          for i in 1 2 3 4 5; do curl -s -o /dev/null -w "%{time_total} " "$API/health"; done; echo
          echo "--- 5x /splits (sign-in lookup + one query)"
          for i in 1 2 3 4 5; do curl -s -o /dev/null -w "%{time_total} " "${H[@]}" "$API/splits"; done; echo
          post() {
            body=$(printf '{"client_id":"%s","text":"%s","created_at":"%s","timezone":"Africa/Cairo"}' "$(cat /proc/sys/kernel/random/uuid)" "$1" "$(date -u +%Y-%m-%dT%H:%M:%SZ)")
            curl -s -m 90 -o /tmp/reply -w "$2 %{http_code} %{time_total}s\n" "${H[@]}" -X POST -d "$body" "$API/messages"
            node -e 'const r=JSON.parse(require("fs").readFileSync("/tmp/reply","utf8"));console.log("   items:",(r.items||[]).map(i=>i.type+" remind="+i.remind_at).join(", ")||"none","| replies:",(r.replies||[]).length)' || true
          }
          # The same POST the way the app sends it since replies show while they are written: "first
          # byte" is when the first words left the server (a stream opens with them). A server
          # without streaming, or a turn the rules answer, answers in one piece as before.
          stream() {
            body=$(printf '{"client_id":"%s","text":"%s","created_at":"%s","timezone":"Africa/Cairo"}' "$(cat /proc/sys/kernel/random/uuid)" "$1" "$(date -u +%Y-%m-%dT%H:%M:%SZ)")
            curl -sN -m 90 -o /tmp/stream --trace-ascii /tmp/trace --trace-time -w "$2 %{http_code} %{content_type} | first byte %{time_starttransfer}s | all %{time_total}s\n" "${H[@]}" -H "accept: text/event-stream, application/json" -d "$body" "$API/messages"
            node -e '
              const fs = require("fs");
              const t = fs.readFileSync("/tmp/stream", "utf8");
              if (!/^event: /m.test(t)) { console.log("   answered in one piece"); process.exit(0); }
              const ev = t.split("\n\n").map((b) => { const e = /^event: (.*)$/m.exec(b), d = /^data: (.*)$/m.exec(b); return e && d ? { e: e[1], d: JSON.parse(d[1]) } : null; }).filter(Boolean);
              const done = ev.find((x) => x.e === "done");
              console.log("   pieces shown:", ev.filter((x) => x.e === "draft").length, "| taken back:", ev.filter((x) => x.e === "reset").length, "| ended with:", ev.at(-1)?.e, "| server ms:", JSON.stringify(done?.d.timing ?? null), "| replies:", (done?.d.body?.replies || []).length);
              // When each part of the answer reached this runner, in seconds after the first part
              // (curl stamps them in its trace). Spread out: the words left the server as the model
              // wrote them. Bunched at the start with one gap before the last part: the reply
              // reached the server in one go.
              const at = fs.readFileSync("/tmp/trace", "utf8").split("\n").map((l) => /^(\d\d):(\d\d):(\d\d\.\d+) <= Recv data,/.exec(l)).filter(Boolean).map((m) => m[1] * 3600 + m[2] * 60 + Number(m[3]));
              console.log("   parts arrived at (s after the first):", at.map((x) => (x - at[0]).toFixed(2)).join(" "));
            ' || true
          }
          echo "--- chat turns"
          post "شكرا" "thanks (rules, no AI)"
          post "فكرني بكره اعزم خالد على حاجة يشربها" "reminder, no time (AI)"
          post "ahh hlw el sa3a 4" "yes, at 4 (AI)"
          post "عامل ايه النهارده" "small talk (AI)"
          echo "--- chat turns read while they are written"
          stream "شكرا" "thanks (rules, no AI)"
          stream "احكيلي حاجة حلوة عن النهارده" "small talk (AI)"
          stream "يومي كان طويل اوي ومحتاج افصل شوية" "small talk 2 (AI)"
          stream "فكرني بكره الساعة 9 الصبح اكلم الدكتور" "reminder with a time (AI: the line that says it is set comes with the answer)"
          # One person using the app leaves the server quiet for more than half a minute all the
          # time. Until 2026-11-26 the API's database pool let a connection go after 30 idle
          # seconds, and the turn after such a pause opened connections again, several round
          # trips each: its first words came about 0.9 s later than the next turn's. The pool
          # now keeps a connection five minutes (apps/api/src/db-pool.ts), so the two turns
          # below should take the same: compare "first byte", and "context" in "server ms".
          case "$QUIET" in '' | *[!0-9]*) QUIET=35 ;; esac
          echo "--- after $QUIET quiet seconds: a chat turn, then the same kind of turn again"
          sleep "$QUIET"
          stream "قولي حاجة تفرحني" "small talk after the quiet (AI)"
          stream "وقولي حاجة كمان" "small talk right after (AI)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Phone client (this commit) against the live API
        working-directory: apps/mobile
        env:
          E2E_API_URL: ${{ env.API }}
        # verbose: the test prints how the chat reply arrived (first words, whole answer).
        run: npx vitest run src/e2e --reporter=verbose
      - name: Phone client of the installed Android build (e47c0d0) against the live API
        if: always()
        working-directory: apps/mobile
        env:
          E2E_API_URL: ${{ env.API }}
        run: |
          cp src/e2e/api.e2e.test.ts /tmp/e2e.test.ts
          git checkout e47c0d0 -- src ../../packages/shared/src
          mkdir -p src/e2e && cp /tmp/e2e.test.ts src/e2e/api.e2e.test.ts
          npx vitest run src/e2e --reporter=verbose
